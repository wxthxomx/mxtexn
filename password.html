<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>password</title>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #151515;
      color: white;
      font-family: sans-serif;
    }

    .password-page {
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }

    input {
      width: 260px;
      padding: 14px 16px;
      border: 1px solid #444;
      border-radius: 12px;
      background: #1f2020;
      color: white;
      font-size: 18px;
      outline: none;
      text-align: center;
    }

    button {
      width: 292px;
      padding: 14px;
      border: 0;
      border-radius: 12px;
      background: #333;
      color: white;
      font-size: 16px;
    }

    .error {
      color: #999;
      font-size: 14px;
      height: 20px;
    }
  </style>
</head>

<body>
  <div class="password-page">
    <input id="password" type="password" placeholder="비밀번호 입력">
    <button onclick="checkPassword()">입장</button>
    <div id="error" class="error"></div>
  </div>

  <script>
    function checkPassword() {
      const input = document.getElementById("password").value;

      if (input === "MIGI") {
        location.href = "chat9.html";
      } else {
        document.getElementById("error").textContent = "입력값을 다시 확인해 주세요.";
      }
    }

    document.getElementById("password").addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        checkPassword();
      }
    });
  </script>
</body>
</html>
