<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>chat</title>

  <style>
body {
  margin: 0;
  background: #111;
  overflow: hidden;
  font-family: sans-serif;
}

/* 상단 고정 */
.top-bar {
  position: fixed;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 500px;
  z-index: 100;
}

.top-bar img {
  width: 100%;
  display: block;
}

/* 채팅 스크롤 */
.chat-scroll {
  height: 100dvh;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  align-items: center;

  /* 상단 헤더 높이만큼 띄우기 */
  padding-top: 120px;
}

.chat-scroll img {
  width: 100%;
  max-width: 500px;
  display: block;
}
  </style>
</head>

<body>

<div class="top-bar">
  <img src="moon_001.png">
</div>

<div class="chat-scroll">

  <img src="moon_002.png">

</div>

</body>
</html>
