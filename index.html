<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>chat</title>

  <style>
    body {
      margin: 0;
      background: #111;
      overflow: hidden;
      font-family: sans-serif;
    }

    .chat-scroll {
      height: 100dvh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }

    .chat-scroll img {
      width: 100%;
      max-width: 500px;
      display: block;
    }
  </style>
</head>

<body>

  <div class="chat-scroll">

    <img src="https://placehold.co/500x900/222/FFF?text=CHAT+1">
    <img src="https://placehold.co/500x900/333/FFF?text=CHAT+2">
    <img src="https://placehold.co/500x900/444/FFF?text=CHAT+3">

  </div>

</body>
</html>
